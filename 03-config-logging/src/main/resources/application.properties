# ===========================================================
# Aetheric Engine Control System — application.properties
# ===========================================================

# Note: quarkus.application.name is a BUILD-TIME property.
# Changing it here has no effect after the application has been packaged —
# the value is baked in during `./mvnw package`. Try changing it and
# running `./mvnw quarkus:dev` vs `./mvnw package` to see the difference.
quarkus.application.name=aetheric-engine-control

# --- Engine Identity ---
engine.location=Cogsworth
engine.name=Great Aetheric Engine
engine.display-name=The ${engine.location}'s Great Aetheric Engine
engine.management-contact=chief-engineer@ironholm.city
engine.broadcast-station=${engine.location} Emergency Broadcasting Network
engine.maintenance-authority=${engine.location} Steam Works Department

# --- Pressure Configuration ---
engine.pressure.min=80
engine.pressure.max=150
engine.pressure.emergency-threshold=200

# --- Fuel Configuration ---
engine.fuel.type=aetheric-coal
engine.fuel.flow-rate=2.5

# --- Temperature Limits ---
engine.temperature.max=200

# ===========================================================
# Profiles
# ===========================================================

%prod.engine.temperature.max=160

# ===========================================================
# Logging
# ===========================================================

quarkus.log.level=INFO

# Console output
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

quarkus.log.file.enabled=true
quarkus.log.file.path=log/engine.log
quarkus.log.file.rotation.enabled=true
quarkus.log.file.rotation.rotate-on-boot=true
quarkus.log.file.rotation.file-suffix=yyyy-MM-dd
