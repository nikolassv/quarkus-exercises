quarkus.application.name=wanneeikel-free-press
quarkus.jackson.write-dates-as-timestamps=false

# Build the native image inside a container, so no local GraalVM/Mandrel
# toolchain is required. Docker (or Podman) must be running.
quarkus.native.container-build=true
quarkus.native.resources.includes=press/manifesto.txt
quarkus.native.additional-build-args=--initialize-at-run-time=com.example.freepress.press.PressRoom
