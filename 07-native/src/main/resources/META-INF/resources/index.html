<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wanneeikel Free Press</title>
    <style>
        body {
            font-family: "Courier New", monospace;
            background: #f3e9d2;
            color: #3a2b1a;
            max-width: 820px;
            margin: 0 auto;
            padding: 1.5rem;
            line-height: 1.5;
        }
        header {
            text-align: center;
            border-bottom: 4px double #b5651d;
            margin-bottom: 1rem;
        }
        h1 { font-size: 2.4rem; letter-spacing: 2px; margin: 0; color: #b5651d; }
        .tagline { font-style: italic; }
        .masthead {
            background: #e9d8a6;
            border: 1px solid #b5651d;
            padding: 0.5rem 0.8rem;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }
        nav button, .article button {
            font-family: inherit;
            background: #b5651d;
            color: #f3e9d2;
            border: none;
            padding: 0.3rem 0.7rem;
            cursor: pointer;
            margin: 0.1rem;
        }
        .article {
            border: 1px solid #b5651d;
            background: #faf3e0;
            padding: 0.8rem 1rem;
            margin-bottom: 1rem;
        }
        .article h2 { margin: 0 0 0.2rem; }
        .section-tag {
            display: inline-block;
            background: #6b8e23;
            color: #f3e9d2;
            font-size: 0.7rem;
            padding: 0.1rem 0.4rem;
            border-radius: 3px;
        }
        .comment { border-left: 3px solid #6b8e23; padding-left: 0.6rem; margin: 0.4rem 0; font-size: 0.9rem; }
        input, textarea { font-family: inherit; width: 100%; box-sizing: border-box; margin: 0.2rem 0; }
        pre { white-space: pre-wrap; background: #faf3e0; border: 1px dashed #b5651d; padding: 0.8rem; }
        .error { color: #a00; }
    </style>
</head>
<body>
<header>
    <h1>WANNEEIKEL FREE PRESS</h1>
    <p class="tagline">Free Love · Peace · Fusion Jazz — since Spring 1972</p>
</header>

<div class="masthead" id="masthead">loading masthead…</div>

<nav>
    <button onclick="loadArticles()">Current Issue</button>
    <button onclick="loadArchive()">The Archive</button>
    <button onclick="loadManifesto()">Manifesto</button>
</nav>

<main id="content">loading…</main>

<script>
    const content = document.getElementById('content');

    async function loadMasthead() {
        const el = document.getElementById('masthead');
        try {
            const r = await fetch('/press');
            if (!r.ok) throw new Error('HTTP ' + r.status);
            const p = await r.json();
            el.innerHTML = `<strong>Thought for the day:</strong> ${p.quoteOfTheDay}<br>` +
                `Went to press: ${p.wentToPress} · Office opened: ${p.officeOpened} · Drift: ${p.driftSeconds}s`;
        } catch (e) {
            el.innerHTML = `<span class="error">The masthead is unavailable (${e.message}).</span>`;
        }
    }

    async function loadArticles() {
        content.innerHTML = 'loading…';
        try {
            const list = await (await fetch('/articles')).json();
            content.innerHTML = '';
            for (const a of list) {
                const view = await (await fetch('/articles/' + a.id)).json();
                content.appendChild(renderArticle(view));
            }
        } catch (e) {
            content.innerHTML = `<p class="error">Could not load the current issue (${e.message}).</p>`;
        }
    }

    function renderArticle(view) {
        const a = view.article;
        const div = document.createElement('div');
        div.className = 'article';
        const comments = (view.comments || []).map(c =>
            `<div class="comment"><strong>${c.author}</strong>: ${c.text}</div>`).join('');
        div.innerHTML = `
            <span class="section-tag">${a.section}</span>
            <h2>${a.title}</h2>
            <p><em>by ${a.author}</em></p>
            <p>${a.body}</p>
            <div>${comments}</div>
            <input placeholder="your name" id="name-${a.id}">
            <textarea placeholder="share your vibes…" id="text-${a.id}"></textarea>
            <button onclick="postComment(${a.id})">Leave a comment</button>`;
        return div;
    }

    async function postComment(id) {
        const author = document.getElementById('name-' + id).value || 'Anonymous';
        const text = document.getElementById('text-' + id).value;
        if (!text) return;
        await fetch('/articles/' + id + '/comments', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({author, text})
        });
        loadArticles();
    }

    async function loadArchive() {
        content.innerHTML = 'loading…';
        try {
            const lines = await (await fetch('/archive')).json();
            content.innerHTML = '<h2>The Archive</h2>' +
                lines.map(l => `<div class="comment">${l}</div>`).join('');
        } catch (e) {
            content.innerHTML = `<p class="error">The archive could not be read (${e.message}).</p>`;
        }
    }

    async function loadManifesto() {
        content.innerHTML = 'loading…';
        try {
            const r = await fetch('/manifesto');
            if (!r.ok) throw new Error('HTTP ' + r.status);
            content.innerHTML = '<pre>' + (await r.text()) + '</pre>';
        } catch (e) {
            content.innerHTML = `<p class="error">The manifesto could not be found (${e.message}).</p>`;
        }
    }

    loadMasthead();
    loadArticles();
</script>
</body>
</html>
