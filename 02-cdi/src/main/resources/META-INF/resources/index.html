<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Starfleet Communications Console</title>
    <style>
        body {
            font-family: monospace;
            background: #0a0a1a;
            color: #00ff99;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            color: #00ccff;
        }

        h2 {
            color: #00ccff;
            border-bottom: 1px solid #00ccff;
            padding-bottom: 4px;
        }

        label {
            display: block;
            margin-top: 10px;
            color: #aaffdd;
        }

        input, select {
            background: #0a1a2a;
            color: #00ff99;
            border: 1px solid #00ff99;
            padding: 6px;
            width: 100%;
            box-sizing: border-box;
        }

        button, a.btn {
            display: inline-block;
            margin-top: 14px;
            padding: 8px 20px;
            background: #003344;
            color: #00ccff;
            border: 1px solid #00ccff;
            cursor: pointer;
            text-decoration: none;
            font-family: monospace;
        }

        button:hover, a.btn:hover {
            background: #005566;
        }

        pre {
            background: #050510;
            padding: 12px;
            border: 1px solid #003344;
            white-space: pre-wrap;
        }

        .section {
            margin-bottom: 40px;
        }
    </style>
</head>
<body>
<h1>&#x2736; Starfleet Communications Console</h1>

<div class="section">
    <h2>Send Transmission</h2>
    <form id="transmitForm">
        <label for="shipName">Ship name</label>
        <input id="shipName" name="shipName" value="USS Enterprise">
        <label for="officer">Officer on duty</label>
        <input id="officer" name="officer" value="Riker">
        <label for="recipient">Recipient</label>
        <input id="recipient" name="recipient" value="Starfleet Command">
        <label for="message">Message</label>
        <input id="message" name="message" value="All systems nominal.">
        <label for="channel">Channel</label>
        <select id="channel" name="channel">
            <option value="SUBSPACE">Subspace Radio</option>
            <option value="WARP_BEACON">Warp Beacon</option>
        </select>
        <button type="submit">&#x25b6; Transmit</button>
    </form>
    <pre id="transmitResult">(response will appear here)</pre>
</div>

<div class="section">
    <h2>Inspect Ship Context</h2>
    <p>
        This calls <code>GET /transmit/context</code> <em>without</em> setting anything first.<br>
        This must not leak any information from any previous request.
    </p>
    <button id="checkContext">&#x1f50d; Check context</button>
    <pre id="contextResult">(response will appear here)</pre>
</div>

<script>
    document.getElementById('transmitForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const params = new URLSearchParams(new FormData(e.target));
        const res = await fetch('/transmit?' + params);
        document.getElementById('transmitResult').textContent = await res.text();
    });

    document.getElementById('checkContext').addEventListener('click', async () => {
        const res = await fetch('/transmit/context');
        document.getElementById('contextResult').textContent = await res.text();
    });
</script>
</body>
</html>
